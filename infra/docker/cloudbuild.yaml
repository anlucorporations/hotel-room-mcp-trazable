# ---------------------------------------------------------------------------
# Cloud Build: construye una imagen del monorepo y la publica en Artifact
# Registry. El componente se elige con la sustitución _APP.
#
# Uso:
#   gcloud builds submit --config=infra/docker/cloudbuild.yaml \
#     --substitutions=_APP=web,_IMAGE=<ar>/web:v1
# ---------------------------------------------------------------------------
substitutions:
  _APP: web
  _IMAGE: ""
  _NEXT_PUBLIC_RPC_URL: ""
  _NEXT_PUBLIC_CHAIN_ID: ""
  _NEXT_PUBLIC_CONTRACT_ADDRESS: ""
  _NEXT_PUBLIC_DEPLOYMENT_BLOCK: "0"
  _NEXT_PUBLIC_FAUCET_ADDRESS: ""
  _NEXT_PUBLIC_NETWORK: ""

steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - --build-arg=APP=${_APP}
      - --build-arg=NEXT_PUBLIC_RPC_URL=${_NEXT_PUBLIC_RPC_URL}
      - --build-arg=NEXT_PUBLIC_CHAIN_ID=${_NEXT_PUBLIC_CHAIN_ID}
      - --build-arg=NEXT_PUBLIC_CONTRACT_ADDRESS=${_NEXT_PUBLIC_CONTRACT_ADDRESS}
      - --build-arg=NEXT_PUBLIC_DEPLOYMENT_BLOCK=${_NEXT_PUBLIC_DEPLOYMENT_BLOCK}
      - --build-arg=NEXT_PUBLIC_FAUCET_ADDRESS=${_NEXT_PUBLIC_FAUCET_ADDRESS}
      - --build-arg=NEXT_PUBLIC_NETWORK=${_NEXT_PUBLIC_NETWORK}
      - --tag=${_IMAGE}
      - .

images:
  - ${_IMAGE}

options:
  machineType: E2_HIGHCPU_8
  diskSizeGb: 50
  logging: CLOUD_LOGGING_ONLY

timeout: 3600s
