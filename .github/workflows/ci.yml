name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancela ejecuciones previas del mismo ref para no acumular CI.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Mínimo privilegio del GITHUB_TOKEN a nivel de workflow (defecto infra #47).
# Eleva permisos por job solo si algún job necesita escribir (p. ej. publicar SARIF).
permissions:
  contents: read

# Toolchains fijadas para builds reproducibles (defectos infra #48-50):
#   - Foundry v1.7.1 (release estable, coherente con solc 0.8.24 del contrato).
#   - pnpm: lo lee action-setup desde "packageManager" de package.json (fuente única).
#   - Node: alineado con .nvmrc / engines.node vía node-version-file.
# Acciones de terceros pinneadas por SHA de commit completo (defecto #46);
# el comentario "# vX.Y.Z" lo mantiene Dependabot (github-actions).
env:
  FOUNDRY_VERSION: v1.7.1

jobs:
  # ── Pipeline principal: monorepo TS + contrato + deploy de humo a Anvil ──────
  build:
    name: Build · typecheck · lint · test · smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          submodules: recursive # deps Solidity (OZ v5, forge-std)
      - uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
        # Sin "version": action-setup lee packageManager (pnpm@10.32.1) de package.json (fuente única).
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc # alinea Node con .nvmrc y engines.node
          cache: pnpm
      - uses: foundry-rs/foundry-toolchain@c7450ba673e133f5ee30098b3b54f444d3a2ca2d # v1.8.0
        with:
          version: ${{ env.FOUNDRY_VERSION }} # Foundry fijado (reproducible)
      - run: pnpm install --frozen-lockfile
      - name: Auditoría de dependencias (SCA, informativa; gate futuro en F2)
        # No bloqueante por ahora (defecto infra #45). Endurecer a gate quitando
        # continue-on-error cuando el inventario de vulnerabilidades esté triado.
        run: pnpm audit --audit-level=high
        continue-on-error: true
      - run: pnpm build # turbo: shared → apps + forge build
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test # vitest (shared/worker/mcp) + forge test
      - name: Deploy de humo a Anvil (chainId 81234) + verificación de roles
        run: pnpm --filter @hotel/contracts smoke

  # ── E2E de la web con Playwright (smoke de FASE 0) ──────────────────────────
  e2e:
    name: Web · Playwright E2E
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
        # Sin "version": fuente única en packageManager de package.json.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @hotel/shared build
      - run: pnpm --filter @hotel/web build
      - name: Instalar navegador
        run: pnpm --filter @hotel/web exec playwright install --with-deps chromium
      - name: Ejecutar E2E
        run: pnpm --filter @hotel/web test:e2e

  # ── Análisis estático del contrato — gate de severidad HIGH (defecto #37 / RNF-14) ──
  # fail-on: high → el job FALLA si Slither encuentra hallazgos de severidad high
  # o superior. Los hallazgos de severidad MEDIUM no bloquean: se triagan a mano
  # (revisión de cada uno: aceptar con justificación en slither.config.json o abrir
  # issue). Bajar el umbral a "medium" cuando el backlog de medium esté triado.
  slither:
    name: Contract · slither (gate high)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          submodules: recursive
      - uses: foundry-rs/foundry-toolchain@c7450ba673e133f5ee30098b3b54f444d3a2ca2d # v1.8.0
        with:
          version: ${{ env.FOUNDRY_VERSION }} # Foundry fijado (reproducible)
      - uses: crytic/slither-action@b52cc1cbfee9ca3e8722dd5224299d16c9a6b80f # v0.4.2
        with:
          target: packages/contracts
          slither-config: packages/contracts/slither.config.json
          fail-on: high # gate de severidad high (deja pasar medium → triage manual)
