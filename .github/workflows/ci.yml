name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Nightly informativo de rendimiento (RNF-11): cron diario + lanzamiento manual.
  # El job `perf-nightly` (abajo) filtra por estos triggers, por lo que NO corre en push/PR.
  schedule:
    - cron: "17 3 * * *" # 03:17 UTC cada día (minuto no redondo: evita el pico de cron de GitHub).
  workflow_dispatch: {}

# Cancela ejecuciones previas del mismo ref para no acumular CI.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Mínimo privilegio del GITHUB_TOKEN a nivel de workflow (defecto infra #47).
# Eleva permisos por job solo si algún job necesita escribir (p. ej. publicar SARIF).
permissions:
  contents: read

# Toolchains fijadas para builds reproducibles (defectos infra #48-50):
#   - Foundry v1.7.1 (release estable, coherente con solc 0.8.24 del contrato).
#   - pnpm: lo lee action-setup desde "packageManager" de package.json (fuente única).
#   - Node: alineado con .nvmrc / engines.node vía node-version-file.
# Acciones de terceros pinneadas por SHA de commit completo (defecto #46);
# el comentario "# vX.Y.Z" lo mantiene Dependabot (github-actions).
env:
  FOUNDRY_VERSION: v1.7.1

jobs:
  # ── Pipeline principal: monorepo TS + contrato + deploy de humo a Anvil ──────
  build:
    name: Build · typecheck · lint · test · smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          submodules: recursive # deps Solidity (OZ v5, forge-std)
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        # Sin "version": action-setup lee packageManager (pnpm@10.32.1) de package.json (fuente única).
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc # alinea Node con .nvmrc y engines.node
          cache: pnpm
      - uses: foundry-rs/foundry-toolchain@c7450ba673e133f5ee30098b3b54f444d3a2ca2d # v1.8.0
        with:
          version: ${{ env.FOUNDRY_VERSION }} # Foundry fijado (reproducible)
      - run: pnpm install --frozen-lockfile
      - name: Auditoría de dependencias (SCA, informativa; gate futuro en F2)
        # No bloqueante por ahora (defecto infra #45). Endurecer a gate quitando
        # continue-on-error cuando el inventario de vulnerabilidades esté triado.
        run: pnpm audit --audit-level=high
        continue-on-error: true
      - run: pnpm build # turbo: shared → apps + forge build
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test # vitest (shared/worker/mcp) + forge test
      - name: Deploy de humo a Anvil (chainId 81234) + verificación de roles
        run: pnpm --filter @hotel/contracts smoke

  # ── E2E de la web con Playwright (smoke de FASE 0) ──────────────────────────
  e2e:
    name: Web · Playwright E2E
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        # Sin "version": fuente única en packageManager de package.json.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @hotel/shared build
      - run: pnpm --filter @hotel/web build
      - name: Instalar navegador
        run: pnpm --filter @hotel/web exec playwright install --with-deps chromium
      - name: Ejecutar E2E
        run: pnpm --filter @hotel/web test:e2e

  # ── Análisis estático del contrato — gate de severidad HIGH (defecto #37 / RNF-14) ──
  # fail-on: high → el job FALLA si Slither encuentra hallazgos de severidad high
  # o superior. Los hallazgos de severidad MEDIUM no bloquean: se triagan a mano
  # (revisión de cada uno: aceptar con justificación en slither.config.json o abrir
  # issue). Bajar el umbral a "medium" cuando el backlog de medium esté triado.
  slither:
    name: Contract · slither (gate high)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          submodules: recursive
      - uses: foundry-rs/foundry-toolchain@c7450ba673e133f5ee30098b3b54f444d3a2ca2d # v1.8.0
        with:
          version: ${{ env.FOUNDRY_VERSION }} # Foundry fijado (reproducible)
      - uses: crytic/slither-action@b52cc1cbfee9ca3e8722dd5224299d16c9a6b80f # v0.4.2
        with:
          target: packages/contracts
          slither-config: packages/contracts/slither.config.json
          fail-on: high # gate de severidad high (deja pasar medium → triage manual)

  # ── Nightly de rendimiento — INDICADOR INFORMATIVO, NO bloqueante (RNF-11) ──────
  # Separado del pipeline de PR: el `if` lo limita a schedule/dispatch, así NO corre en push/PR.
  # No es un gate: `continue-on-error: true` en el step de medición evita que un WARN tumbe el
  # nightly. La medición canónica P75 (4G/lab) sigue siendo manual; esto es una señal de tendencia.
  # Levanta la MISMA web hermética que el job `e2e` (sin backend real: RPC/worker apuntan a
  # 127.0.0.1:1 → estados degradados deterministas), por lo que el catálogo renderiza igual.
  perf-nightly:
    name: Web · perf nightly (RNF-11, informativo)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    env:
      WEB_PORT: "3100"
      # Web hermética: sin backend (espejo del webServer de playwright.config.ts).
      SESSION_SECRET: perf-nightly-secret
      ANTHROPIC_API_KEY: ""
      RPC_URL: http://127.0.0.1:1
      WORKER_BASE_URL: http://127.0.0.1:1
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        # Sin "version": fuente única en packageManager de package.json.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @hotel/shared build
      - run: pnpm --filter @hotel/web build
      - name: Instalar navegador
        run: pnpm --filter @hotel/web exec playwright install --with-deps chromium
      - name: Arrancar web hermética (next start) en segundo plano
        # Arranca el build de producción y espera a que responda antes de medir (sin esperas fijas).
        run: |
          pnpm --filter @hotel/web exec next start --port "${WEB_PORT}" &
          echo "WEB_PID=$!" >> "$GITHUB_ENV"
          for i in $(seq 1 60); do
            if curl -fsS "http://127.0.0.1:${WEB_PORT}/" >/dev/null 2>&1; then
              echo "Web arriba tras ${i}s"; exit 0
            fi
            sleep 1
          done
          echo "La web no respondió a tiempo en el puerto ${WEB_PORT}" >&2
          exit 1
      - name: Medir rendimiento (RNF-11, no bloqueante)
        id: perf
        continue-on-error: true # indicador informativo: un WARN no debe tumbar el nightly.
        env:
          WEB_URL: http://127.0.0.1:3100
        run: |
          mkdir -p perf-report
          node apps/web/scripts/measure-perf.mjs | tee perf-report/measure-perf.txt
      - name: Parar la web
        if: always()
        run: kill "${WEB_PID}" 2>/dev/null || true
      - name: Subir informe de rendimiento como artifact
        if: always() # sube el reporte aunque la medición termine en WARN/fallo.
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: perf-report
          path: perf-report/
          if-no-files-found: warn
          retention-days: 30
