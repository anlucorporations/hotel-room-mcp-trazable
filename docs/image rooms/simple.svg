    <linearGradient id="bgSimple" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fefffc"/>
      <stop offset="100%" stop-color="#eef1ed"/>
    </linearGradient>
  </defs>
  <rect width="400" height="300" fill="url(#bgSimple)"/>
  <rect x="40" y="60" width="320" height="190" rx="12" fill="#ffffff" stroke="#dee2de" stroke-width="2"/>
  <!-- cama individual -->
  <rect x="80" y="160" width="180" height="60" rx="8" fill="#f9faf7" stroke="#b4b8b4"/>
  <rect x="80" y="160" width="40" height="60" rx="8" fill="#dee2de"/>
  <!-- mesilla -->
  <rect x="270" y="180" width="50" height="40" rx="4" fill="#eef1ed" stroke="#b4b8b4"/>
  <circle cx="295" cy="170" r="6" fill="#f5b300"/>
  <!-- texto -->
  <text x="50" y="100" font-family="ui-sans-serif, system-ui, -apple-system" font-size="22" font-weight="600" fill="#171717">
    Habitación Simple
  </text>
  <text x="50" y="124" font-family="ui-sans-serif, system-ui, -apple-system" font-size="13" fill="#646464">
    Una cama · vista interior
