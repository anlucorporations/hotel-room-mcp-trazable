<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-label="Habitación deluxe">
  <defs>
    <linearGradient id="bgDeluxe" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fefffc"/>
      <stop offset="100%" stop-color="#dee2de"/>
    </linearGradient>
  </defs>
  <rect width="400" height="300" fill="url(#bgDeluxe)"/>
  <rect x="40" y="60" width="320" height="190" rx="14" fill="#ffffff" stroke="#b4b8b4" stroke-width="2"/>
  <!-- cama king + dosel -->
  <rect x="80" y="100" width="240" height="14" fill="#171717"/>
  <rect x="70" y="160" width="260" height="80" rx="12" fill="#f9faf7" stroke="#646464"/>
  <rect x="70" y="160" width="50" height="80" rx="12" fill="#dee2de"/>
  <!-- lámpara/sofa -->
  <circle cx="350" cy="220" r="14" fill="#f5b300"/>
  <rect x="55" y="220" width="32" height="30" rx="4" fill="#eef1ed" stroke="#646464"/>
  <!-- texto -->
  <text x="50" y="80" font-family="ui-sans-serif, system-ui, -apple-system" font-size="22" font-weight="600" fill="#171717">
    Suite Deluxe
  </text>
  <text x="220" y="80" font-family="ui-sans-serif, system-ui, -apple-system" font-size="13" fill="#0081c0">
