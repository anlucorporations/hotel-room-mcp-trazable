<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000" role="img" aria-labelledby="pd-titulo pd-desc">
  <title id="pd-titulo">Maqueta del panel del dueño con menú, siete cifras y tres gráficos</title>
  <desc id="pd-desc">Maqueta del panel de administración. A la izquierda, el menú lateral con Publicar noche, Métricas, Royalty, Pausa, Fondos, Caducadas y Roles. Arriba, siete tarjetas de cifras: Vendido, Royalties, Reventa, Noches vendidas, Minteadas, Quemadas y Ocupación, con números de ejemplo redondos. Debajo, tres gráficos: barras por mes, barras por tipo de habitación (simple, doble y suite) y una lista de ranking de las noches más revendidas.</desc>
  <defs>
    <filter id="pd-sombra" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#0E5A63" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="1600" height="1000" fill="#FBF6EC"/>

  <!-- marco de la aplicación -->
  <g filter="url(#pd-sombra)">
    <rect x="24" y="24" width="1552" height="952" rx="24" fill="#FFFFFF" stroke="#E7DCC6" stroke-width="2"/>
  </g>

  <!-- menú lateral -->
  <path d="M24 48 a24 24 0 0 1 24 -24 h216 v952 h-216 a24 24 0 0 1 -24 -24 z" fill="#0E5A63"/>
  <text x="48" y="80" font-family="'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="20" font-weight="700" fill="#FBF6EC">Panel del dueño</text>
  <rect x="44" y="194" width="200" height="52" rx="12" fill="#FBF6EC" fill-opacity="0.18"/>
  <g font-family="'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="22" fill="#FBF6EC">
    <text x="64" y="164">Publicar noche</text>
    <text x="64" y="228" font-weight="700">Métricas</text>
    <text x="64" y="292">Royalty</text>
    <text x="64" y="356">Pausa</text>
    <text x="64" y="420">Fondos</text>
    <text x="64" y="484">Caducadas</text>
    <text x="64" y="548">Roles</text>
  </g>

  <!-- cabecera -->
  <text x="304" y="96" font-family="Fraunces, Georgia, 'Times New Roman', serif" font-size="36" font-weight="700" fill="#08424A">Métricas</text>
  <text x="1536" y="92" text-anchor="end" font-family="'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="20" fill="#4C575C">Hotel Marina del Sol · cartera conectada</text>
  <path d="M304 120 H1536" stroke="#E7DCC6" stroke-width="2" fill="none"/>

