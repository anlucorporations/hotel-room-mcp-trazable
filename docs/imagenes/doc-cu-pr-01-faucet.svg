<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="t d">
  <title id="t">CU-PR-01 · Conseguir dinero de prueba: conectar la cartera, pulsar el botón, firmar y recibir</title>
  <desc id="d">Cinco tarjetas numeradas unidas por flechas. La primera conecta la cartera en la web de pruebas; la segunda comprueba que la red es la correcta; la tercera pulsa el botón Conseguir ETH de prueba; la cuarta firma la petición en la cartera; la quinta muestra el saldo con 30 ETH y la espera de 24 horas. Abajo se resume quién puede pedirlo, qué se consigue y qué pasa si algo falla.</desc>
  <rect width="1600" height="900" fill="#F8F3E9"/>
  <rect x="0" y="0" width="1600" height="156" fill="#084659"/>
  <text x="60" y="66" font-family="'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="24" font-weight="700" fill="#D9E8EC" letter-spacing="2">CU-PR-01 · BLOQUE 7</text>
  <text x="60" y="122" font-family="Fraunces, Georgia, 'Times New Roman', serif" font-size="42" font-weight="700" fill="#FFFFFF">Conseguir dinero de prueba</text>

  <!-- paso 1 -->
  <rect x="60" y="210" width="270" height="420" rx="18" fill="#FFFFFF" stroke="#E4D9C5" stroke-width="2"/>
  <circle cx="195" cy="300" r="36" fill="#084659"/>
  <text x="195" y="312" text-anchor="middle" font-family="'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="30" font-weight="700" fill="#FFFFFF">1</text>
  <text x="195" y="408" text-anchor="middle" font-family="'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="22" font-weight="700" fill="#15222C">Conectar cartera</text>
  <text x="195" y="474" text-anchor="middle" font-family="'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="20" fill="#495764">Abre la web</text>
  <text x="195" y="506" text-anchor="middle" font-family="'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="20" fill="#495764">y conecta la cartera.</text>
  <path d="M96 530 H294" stroke="#E4D9C5" stroke-width="2" fill="none"/>
  <rect x="90" y="546" width="210" height="48" rx="14" fill="#EFE7D6" stroke="#E4D9C5" stroke-width="2"/>
  <text x="195" y="577" text-anchor="middle" font-family="'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="20" font-weight="700" fill="#0B5C74">Red de pruebas</text>

  <!-- paso 2 -->
  <rect x="360" y="210" width="270" height="420" rx="18" fill="#FFFFFF" stroke="#E4D9C5" stroke-width="2"/>
  <circle cx="495" cy="300" r="36" fill="#084659"/>
  <text x="495" y="312" text-anchor="middle" font-family="'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="30" font-weight="700" fill="#FFFFFF">2</text>
  <text x="495" y="408" text-anchor="middle" font-family="'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="22" font-weight="700" fill="#15222C">Mirar la red</text>
  <text x="495" y="474" text-anchor="middle" font-family="'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="20" fill="#495764">Debe ser la red de</text>
  <text x="495" y="506" text-anchor="middle" font-family="'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="20" fill="#495764">pruebas, no otra.</text>
  <path d="M396 530 H594" stroke="#E4D9C5" stroke-width="2" fill="none"/>
  <rect x="390" y="546" width="210" height="48" rx="14" fill="#F9EFD4"/>
  <text x="495" y="577" text-anchor="middle" font-family="'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="20" font-weight="700" fill="#875A0B">Solo pruebas</text>

  <!-- paso 3 -->
  <rect x="660" y="210" width="270" height="420" rx="18" fill="#FFFFFF" stroke="#E4D9C5" stroke-width="2"/>
  <circle cx="795" cy="300" r="36" fill="#084659"/>
  <text x="795" y="312" text-anchor="middle" font-family="'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="30" font-weight="700" fill="#FFFFFF">3</text>
  <text x="795" y="408" text-anchor="middle" font-family="'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="22" font-weight="700" fill="#15222C">Pulsar el botón</text>
  <text x="795" y="474" text-anchor="middle" font-family="'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="20" fill="#495764">Pulsa el botón de</text>
  <text x="795" y="506" text-anchor="middle" font-family="'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="20" fill="#495764">ETH de prueba.</text>
  <path d="M696 530 H894" stroke="#E4D9C5" stroke-width="2" fill="none"/>
  <rect x="690" y="546" width="210" height="48" rx="14" fill="#EFE7D6" stroke="#E4D9C5" stroke-width="2"/>
  <text x="795" y="577" text-anchor="middle" font-family="'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="20" font-weight="700" fill="#0B5C74">Botón en la barra</text>

  <!-- paso 4 -->
  <rect x="960" y="210" width="270" height="420" rx="18" fill="#FFFFFF" stroke="#E4D9C5" stroke-width="2"/>
  <circle cx="1095" cy="300" r="36" fill="#084659"/>
  <text x="1095" y="312" text-anchor="middle" font-family="'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="30" font-weight="700" fill="#FFFFFF">4</text>
  <text x="1095" y="408" text-anchor="middle" font-family="'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="22" font-weight="700" fill="#15222C">Firmar petición</text>
  <text x="1095" y="474" text-anchor="middle" font-family="'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="20" fill="#495764">Revisa en tu cartera</text>
  <text x="1095" y="506" text-anchor="middle" font-family="'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="20" fill="#495764">y confirma la firma.</text>
  <path d="M996 530 H1194" stroke="#E4D9C5" stroke-width="2" fill="none"/>
  <rect x="990" y="546" width="210" height="48" rx="14" fill="#EFE7D6" stroke="#E4D9C5" stroke-width="2"/>
  <text x="1095" y="577" text-anchor="middle" font-family="'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="20" font-weight="700" fill="#0B5C74">Tú firmas</text>

  <!-- paso 5 -->
  <rect x="1260" y="210" width="270" height="420" rx="18" fill="#FFFFFF" stroke="#E4D9C5" stroke-width="2"/>
  <circle cx="1395" cy="300" r="36" fill="#084659"/>
  <text x="1395" y="312" text-anchor="middle" font-family="'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="30" font-weight="700" fill="#FFFFFF">5</text>
  <text x="1395" y="408" text-anchor="middle" font-family="'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="22" font-weight="700" fill="#15222C">Ver el saldo</text>
  <text x="1395" y="474" text-anchor="middle" font-family="'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="20" fill="#495764">Llegan 30 ETH;</text>
  <text x="1395" y="506" text-anchor="middle" font-family="'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="20" fill="#495764">repite en 24 horas.</text>
  <path d="M1296 530 H1494" stroke="#E4D9C5" stroke-width="2" fill="none"/>
  <rect x="1290" y="546" width="210" height="48" rx="14" fill="#E2F0E8"/>
  <text x="1395" y="577" text-anchor="middle" font-family="'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="20" font-weight="700" fill="#1C6E48">Espera 24 horas</text>

  <text x="345" y="428" text-anchor="middle" font-family="'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="26" font-weight="700" fill="#0B5C74">&#8594;</text>
  <text x="645" y="428" text-anchor="middle" font-family="'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="26" font-weight="700" fill="#0B5C74">&#8594;</text>
  <text x="945" y="428" text-anchor="middle" font-family="'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="26" font-weight="700" fill="#0B5C74">&#8594;</text>
  <text x="1245" y="428" text-anchor="middle" font-family="'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="26" font-weight="700" fill="#0B5C74">&#8594;</text>

  <rect x="0" y="740" width="1600" height="160" fill="#EFE7D6"/>
  <text x="60" y="790" font-family="'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="20" font-weight="700" fill="#495764" letter-spacing="1.5">QUIÉN</text>
  <text x="60" y="838" font-family="'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="24" font-weight="700" fill="#15222C">Tester con cartera en pruebas</text>
  <text x="590" y="790" font-family="'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="20" font-weight="700" fill="#495764" letter-spacing="1.5">QUÉ CONSIGUES</text>
  <text x="590" y="838" font-family="'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="24" font-weight="700" fill="#15222C">30 ETH de prueba para practicar</text>
  <text x="1120" y="790" font-family="'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="20" font-weight="700" fill="#495764" letter-spacing="1.5">SI FALLA</text>
  <text x="1120" y="838" font-family="'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="24" font-weight="700" fill="#15222C">Sin fondos o aún en espera:</text>
  <text x="1120" y="872" font-family="'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="24" font-weight="700" fill="#15222C">avisa o espera tu turno</text>
</svg>
