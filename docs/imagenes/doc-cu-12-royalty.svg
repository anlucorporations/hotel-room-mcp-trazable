<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="t d">
  <title id="t">CU-12 · Cuánto se queda el hotel: consultar el porcentaje fijo de cada tipo de habitación</title>
  <desc id="d">Cinco tarjetas numeradas unidas por flechas. La primera abre la sección Royalty; la segunda lee el aviso de que el porcentaje se fija al crear la noche; la tercera muestra la tabla con un 5 % para simple y doble y un 10 % para suite; la cuarta recuerda que el dato sale del contrato; la quinta cierra sin guardar nada. Abajo se resume quién puede verlo, qué se consigue y qué pasa si algo falla.</desc>
  <rect width="1600" height="900" fill="#FBF6EC"/>
  <rect x="0" y="0" width="1600" height="156" fill="#08424A"/>
  <text x="60" y="66" font-family="'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="24" font-weight="700" fill="#C5A880" letter-spacing="2">CU-12 · BLOQUE 1</text>
  <text x="60" y="122" font-family="Fraunces, Georgia, 'Times New Roman', serif" font-size="42" font-weight="700" fill="#FFFFFF">Cuánto se queda el hotel</text>

  <!-- paso 1 -->
  <rect x="60" y="210" width="270" height="420" rx="18" fill="#FFFFFF" stroke="#E7DCC6" stroke-width="2"/>
  <circle cx="195" cy="300" r="36" fill="#08424A"/>
  <text x="195" y="312" text-anchor="middle" font-family="'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="30" font-weight="700" fill="#FFFFFF">1</text>
  <text x="195" y="408" text-anchor="middle" font-family="'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="22" font-weight="700" fill="#1B2327">Abrir Royalty</text>
  <text x="195" y="474" text-anchor="middle" font-family="'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="20" fill="#4C575C">Entra en la sección</text>
  <text x="195" y="506" text-anchor="middle" font-family="'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="20" fill="#4C575C">Royalty del panel.</text>
  <path d="M96 530 H294" stroke="#E7DCC6" stroke-width="2" fill="none"/>
  <rect x="90" y="546" width="210" height="48" rx="14" fill="#F3EAD8" stroke="#E7DCC6" stroke-width="2"/>
  <text x="195" y="577" text-anchor="middle" font-family="'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="20" font-weight="700" fill="#0E5A63">/admin/royalty</text>

  <!-- paso 2 -->
  <rect x="360" y="210" width="270" height="420" rx="18" fill="#FFFFFF" stroke="#E7DCC6" stroke-width="2"/>
  <circle cx="495" cy="300" r="36" fill="#08424A"/>
  <text x="495" y="312" text-anchor="middle" font-family="'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="30" font-weight="700" fill="#FFFFFF">2</text>
  <text x="495" y="408" text-anchor="middle" font-family="'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="22" font-weight="700" fill="#1B2327">Leer el aviso</text>
  <text x="495" y="474" text-anchor="middle" font-family="'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="20" fill="#4C575C">El porcentaje se fija</text>
  <text x="495" y="506" text-anchor="middle" font-family="'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="20" fill="#4C575C">al crear la noche.</text>
  <path d="M396 530 H594" stroke="#E7DCC6" stroke-width="2" fill="none"/>
  <rect x="390" y="546" width="210" height="48" rx="14" fill="#F7E9C9"/>
  <text x="495" y="577" text-anchor="middle" font-family="'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="20" font-weight="700" fill="#8A5A12">No se cambia</text>

  <!-- paso 3 -->
  <rect x="660" y="210" width="270" height="420" rx="18" fill="#FFFFFF" stroke="#E7DCC6" stroke-width="2"/>
  <circle cx="795" cy="300" r="36" fill="#08424A"/>
  <text x="795" y="312" text-anchor="middle" font-family="'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="30" font-weight="700" fill="#FFFFFF">3</text>
  <text x="795" y="408" text-anchor="middle" font-family="'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="22" font-weight="700" fill="#1B2327">Mirar la tabla</text>
  <text x="795" y="474" text-anchor="middle" font-family="'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="20" fill="#4C575C">Simple y doble: 5 %.</text>
  <text x="795" y="506" text-anchor="middle" font-family="'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="20" fill="#4C575C">Suite: 10 %.</text>
  <path d="M696 530 H894" stroke="#E7DCC6" stroke-width="2" fill="none"/>
  <rect x="690" y="546" width="210" height="48" rx="14" fill="#F3EAD8" stroke="#E7DCC6" stroke-width="2"/>
  <text x="795" y="577" text-anchor="middle" font-family="'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="20" font-weight="700" fill="#0E5A63">Tres tipos</text>

  <!-- paso 4 -->
  <rect x="960" y="210" width="270" height="420" rx="18" fill="#FFFFFF" stroke="#E7DCC6" stroke-width="2"/>
  <circle cx="1095" cy="300" r="36" fill="#08424A"/>
  <text x="1095" y="312" text-anchor="middle" font-family="'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="30" font-weight="700" fill="#FFFFFF">4</text>
  <text x="1095" y="408" text-anchor="middle" font-family="'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="22" font-weight="700" fill="#1B2327">Ver la fuente</text>
  <text x="1095" y="474" text-anchor="middle" font-family="'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="20" fill="#4C575C">El contrato es la</text>
  <text x="1095" y="506" text-anchor="middle" font-family="'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="20" fill="#4C575C">fuente única del dato.</text>
  <path d="M996 530 H1194" stroke="#E7DCC6" stroke-width="2" fill="none"/>
  <rect x="990" y="546" width="210" height="48" rx="14" fill="#F3EAD8" stroke="#E7DCC6" stroke-width="2"/>
  <text x="1095" y="577" text-anchor="middle" font-family="'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="20" font-weight="700" fill="#0E5A63">Manda el contrato</text>

  <!-- paso 5 -->
  <rect x="1260" y="210" width="270" height="420" rx="18" fill="#FFFFFF" stroke="#E7DCC6" stroke-width="2"/>
  <circle cx="1395" cy="300" r="36" fill="#08424A"/>
  <text x="1395" y="312" text-anchor="middle" font-family="'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="30" font-weight="700" fill="#FFFFFF">5</text>
  <text x="1395" y="408" text-anchor="middle" font-family="'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="22" font-weight="700" fill="#1B2327">Cerrar sin guardar</text>
  <text x="1395" y="474" text-anchor="middle" font-family="'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="20" fill="#4C575C">Solo lectura: no hay</text>
  <text x="1395" y="506" text-anchor="middle" font-family="'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="20" fill="#4C575C">botón de guardar.</text>
  <path d="M1296 530 H1494" stroke="#E7DCC6" stroke-width="2" fill="none"/>
  <rect x="1290" y="546" width="210" height="48" rx="14" fill="#E3EFE7"/>
  <text x="1395" y="577" text-anchor="middle" font-family="'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="20" font-weight="700" fill="#2F6B4F">Solo mirar</text>

  <text x="345" y="428" text-anchor="middle" font-family="'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="26" font-weight="700" fill="#0E5A63">&#8594;</text>
  <text x="645" y="428" text-anchor="middle" font-family="'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="26" font-weight="700" fill="#0E5A63">&#8594;</text>
  <text x="945" y="428" text-anchor="middle" font-family="'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="26" font-weight="700" fill="#0E5A63">&#8594;</text>
  <text x="1245" y="428" text-anchor="middle" font-family="'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="26" font-weight="700" fill="#0E5A63">&#8594;</text>

  <rect x="0" y="740" width="1600" height="160" fill="#F3EAD8"/>
  <text x="60" y="790" font-family="'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="20" font-weight="700" fill="#4C575C" letter-spacing="1.5">QUIÉN</text>
  <text x="60" y="838" font-family="'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="24" font-weight="700" fill="#1B2327">Super-admin (no hay rol de royalty)</text>
  <text x="590" y="790" font-family="'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="20" font-weight="700" fill="#4C575C" letter-spacing="1.5">QUÉ CONSIGUES</text>
  <text x="590" y="838" font-family="'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="24" font-weight="700" fill="#1B2327">El porcentaje de cada tipo</text>
  <text x="1120" y="790" font-family="'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="20" font-weight="700" fill="#4C575C" letter-spacing="1.5">SI FALLA</text>
  <text x="1120" y="838" font-family="'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="24" font-weight="700" fill="#1B2327">No hay botón de cambio:</text>
  <text x="1120" y="872" font-family="'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="24" font-weight="700" fill="#1B2327">es así por diseño</text>
</svg>
