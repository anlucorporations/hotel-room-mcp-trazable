<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 780" width="800" height="780" role="img" aria-labelledby="cko-titulo cko-desc">
  <title id="cko-titulo">Flujo del check-out: recoges tus cosas, entregas la habitación, recepción la revisa, cancela los cargos y cierra la cuenta</title>
  <desc id="cko-desc">Cinco pasos encadenados de arriba abajo. Recoges tus cosas, entregas la habitación y las llaves, recepción revisa cómo quedó la habitación, recepción cancela los cargos que no se cobran, y la cuenta queda cerrada con la habitación pendiente de limpieza.</desc>
  <defs>
    <marker id="cko-azul" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#0B5C74"/>
    </marker>
  </defs>

  <rect width="800" height="780" fill="#F8F3E9"/>
  <rect x="0" y="0" width="800" height="90" fill="#084659"/>
  <text x="40" y="36" font-family="system-ui, Arial, sans-serif" font-size="14" font-weight="700" fill="#D9E8EC" letter-spacing="1.5">MANUAL DEL HUÉSPED · 12 · SALIR Y CERRAR LA CUENTA</text>
  <text x="40" y="70" font-family="system-ui, Arial, sans-serif" font-size="24" font-weight="700" fill="#FFFFFF">Salir del hotel y cerrar la cuenta</text>

  <!-- paso 1 -->
  <rect x="90" y="120" width="620" height="88" rx="16" fill="#FFFFFF" stroke="#E4D9C5" stroke-width="2"/>
  <rect x="90" y="138" width="6" height="52" rx="3" fill="#0B5C74"/>
  <circle cx="140" cy="164" r="22" fill="#084659"/>
  <text x="140" y="171" text-anchor="middle" font-family="system-ui, Arial, sans-serif" font-size="20" font-weight="700" fill="#FFFFFF">1</text>
  <text x="182" y="158" font-family="system-ui, Arial, sans-serif" font-size="18" font-weight="700" fill="#15222C">Recoges tus cosas</text>
  <text x="182" y="184" font-family="system-ui, Arial, sans-serif" font-size="14" fill="#495764">No abres ninguna pantalla</text>

  <line x1="400" y1="210" x2="400" y2="242" stroke="#0B5C74" stroke-width="3" marker-end="url(#cko-azul)"/>

  <!-- paso 2 -->
  <rect x="90" y="244" width="620" height="88" rx="16" fill="#FFFFFF" stroke="#E4D9C5" stroke-width="2"/>
  <rect x="90" y="262" width="6" height="52" rx="3" fill="#0B5C74"/>
  <circle cx="140" cy="288" r="22" fill="#084659"/>
  <text x="140" y="295" text-anchor="middle" font-family="system-ui, Arial, sans-serif" font-size="20" font-weight="700" fill="#FFFFFF">2</text>
  <text x="182" y="282" font-family="system-ui, Arial, sans-serif" font-size="18" font-weight="700" fill="#15222C">Entregas la habitación y las llaves</text>
  <text x="182" y="308" font-family="system-ui, Arial, sans-serif" font-size="14" fill="#495764">El resguardo QR ya se gastó al entrar</text>

  <line x1="400" y1="334" x2="400" y2="366" stroke="#0B5C74" stroke-width="3" marker-end="url(#cko-azul)"/>

  <!-- paso 3 -->
  <rect x="90" y="368" width="620" height="88" rx="16" fill="#FFFFFF" stroke="#E4D9C5" stroke-width="2"/>
  <rect x="90" y="386" width="6" height="52" rx="3" fill="#0B5C74"/>
  <circle cx="140" cy="412" r="22" fill="#084659"/>
  <text x="140" y="419" text-anchor="middle" font-family="system-ui, Arial, sans-serif" font-size="20" font-weight="700" fill="#FFFFFF">3</text>
  <text x="182" y="406" font-family="system-ui, Arial, sans-serif" font-size="18" font-weight="700" fill="#15222C">Recepción revisa cómo quedó la habitación</text>
  <text x="182" y="432" font-family="system-ui, Arial, sans-serif" font-size="14" fill="#495764">Sin incidencias o con incidencia</text>

  <line x1="400" y1="458" x2="400" y2="490" stroke="#0B5C74" stroke-width="3" marker-end="url(#cko-azul)"/>

  <!-- paso 4 -->
  <rect x="90" y="492" width="620" height="88" rx="16" fill="#FFFFFF" stroke="#E4D9C5" stroke-width="2"/>
  <rect x="90" y="510" width="6" height="52" rx="3" fill="#0B5C74"/>
  <circle cx="140" cy="536" r="22" fill="#084659"/>
  <text x="140" y="543" text-anchor="middle" font-family="system-ui, Arial, sans-serif" font-size="20" font-weight="700" fill="#FFFFFF">4</text>
  <text x="182" y="530" font-family="system-ui, Arial, sans-serif" font-size="18" font-weight="700" fill="#15222C">Recepción cancela los cargos que no se cobran</text>
  <text x="182" y="556" font-family="system-ui, Arial, sans-serif" font-size="14" fill="#495764">Tú no firmas nada</text>

  <line x1="400" y1="582" x2="400" y2="614" stroke="#0B5C74" stroke-width="3" marker-end="url(#cko-azul)"/>

  <!-- paso 5 · resultado -->
  <rect x="90" y="616" width="620" height="88" rx="16" fill="#E2F0E8" stroke="#1C6E48" stroke-width="2"/>
  <rect x="90" y="634" width="6" height="52" rx="3" fill="#1C6E48"/>
  <circle cx="140" cy="660" r="22" fill="#1C6E48"/>
  <text x="140" y="667" text-anchor="middle" font-family="system-ui, Arial, sans-serif" font-size="20" font-weight="700" fill="#FFFFFF">5</text>
  <text x="182" y="654" font-family="system-ui, Arial, sans-serif" font-size="18" font-weight="700" fill="#15222C">Cuenta cerrada y habitación pendiente de limpieza</text>
  <text x="182" y="680" font-family="system-ui, Arial, sans-serif" font-size="14" fill="#495764">La salida no se anota en la red del hotel</text>

  <text x="400" y="750" text-anchor="middle" font-family="system-ui, Arial, sans-serif" font-size="14" fill="#495764">El cierre no se puede deshacer: si hay un error, avisa a administración.</text>
</svg>
