    <rect x="689" y="364" width="92" height="84" rx="6"/>
    <rect x="819" y="364" width="92" height="84" rx="6"/>
    <rect x="949" y="364" width="92" height="84" rx="6"/>
    <rect x="1079" y="364" width="92" height="84" rx="6"/>
    <rect x="429" y="476" width="92" height="84" rx="6"/>
    <rect x="559" y="476" width="92" height="84" rx="6"/>
    <rect x="689" y="476" width="92" height="84" rx="6"/>
    <rect x="819" y="476" width="92" height="84" rx="6"/>
    <rect x="949" y="476" width="92" height="84" rx="6"/>
    <rect x="1079" y="476" width="92" height="84" rx="6"/>
  </g>
  <g fill="#08424A" fill-opacity="0.40">
    <rect x="423" y="336" width="104" height="6" rx="3"/>
    <rect x="553" y="336" width="104" height="6" rx="3"/>
    <rect x="683" y="336" width="104" height="6" rx="3"/>
    <rect x="813" y="336" width="104" height="6" rx="3"/>
    <rect x="943" y="336" width="104" height="6" rx="3"/>
    <rect x="1073" y="336" width="104" height="6" rx="3"/>
    <rect x="423" y="448" width="104" height="6" rx="3"/>
    <rect x="553" y="448" width="104" height="6" rx="3"/>
    <rect x="683" y="448" width="104" height="6" rx="3"/>
    <rect x="813" y="448" width="104" height="6" rx="3"/>
    <rect x="943" y="448" width="104" height="6" rx="3"/>
    <rect x="1073" y="448" width="104" height="6" rx="3"/>
  </g>

  <!-- entrada principal -->
  <rect x="714" y="548" width="172" height="24" rx="8" fill="#C0542E"/>
  <rect x="740" y="580" width="120" height="100" rx="8" fill="#0E5A63"/>
  <rect x="790" y="580" width="4" height="100" fill="#FBF6EC" fill-opacity="0.55"/>
  <rect x="700" y="680" width="200" height="12" rx="6" fill="#08424A" fill-opacity="0.22"/>

  <!-- palmeras -->
  <g filter="url(#ph-sombra)">
    <path d="M178 828 Q 182 640 184 470 L 196 470 Q 198 640 202 828 Z" fill="#C68A2E"/>
    <ellipse cx="140" cy="452" rx="58" ry="15" transform="rotate(-22 140 452)" fill="#5E6B45"/>
    <ellipse cx="240" cy="452" rx="58" ry="15" transform="rotate(22 240 452)" fill="#5E6B45"/>
    <ellipse cx="126" cy="484" rx="62" ry="14" transform="rotate(-8 126 484)" fill="#5E6B45"/>
    <ellipse cx="254" cy="484" rx="62" ry="14" transform="rotate(8 254 484)" fill="#5E6B45"/>
    <ellipse cx="190" cy="424" rx="52" ry="14" fill="#5E6B45"/>
