    <ellipse cx="1410" cy="424" rx="52" ry="14" fill="#5E6B45"/>
    <circle cx="1410" cy="466" r="10" fill="#08424A"/>
  </g>

  <!-- sombrillas y tumbonas del paseo -->
  <g>
    <rect x="322" y="706" width="8" height="146" rx="4" fill="#08424A"/>
    <path d="M254 712 Q 326 636 398 712 Z" fill="#C0542E"/>
    <rect x="212" y="852" width="126" height="26" rx="12" fill="#FFFFFF" stroke="#E7DCC6" stroke-width="2"/>
    <rect x="212" y="828" width="14" height="30" rx="6" fill="#FFFFFF" stroke="#E7DCC6" stroke-width="2" transform="rotate(-18 219 843)"/>
  </g>
  <g>
    <rect x="1258" y="706" width="8" height="146" rx="4" fill="#08424A"/>
    <path d="M1190 712 Q 1262 636 1334 712 Z" fill="#C0542E"/>
    <rect x="1250" y="852" width="126" height="26" rx="12" fill="#FFFFFF" stroke="#E7DCC6" stroke-width="2"/>
    <rect x="1362" y="828" width="14" height="30" rx="6" fill="#FFFFFF" stroke="#E7DCC6" stroke-width="2" transform="rotate(18 1369 843)"/>
  </g>

  <!-- nombre y línea de presentación -->
  <text x="800" y="112" text-anchor="middle" font-family="Fraunces, Georgia, 'Times New Roman', serif" font-size="76" font-weight="700" fill="#0F2C3F" textLength="840" lengthAdjust="spacingAndGlyphs">Hotel Marina del Sol</text>
  <text x="800" y="164" text-anchor="middle" font-family="'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="30" fill="#4C575C" textLength="830" lengthAdjust="spacingAndGlyphs">50 habitaciones · Alicante · noches en propiedad</text>
</svg>
