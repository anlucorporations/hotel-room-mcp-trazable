  </g>
  <g filter="url(#ph-sombra)">
    <path d="M1398 828 Q 1402 640 1404 470 L 1416 470 Q 1418 640 1422 828 Z" fill="#C68A2E"/>
    <ellipse cx="1360" cy="452" rx="58" ry="15" transform="rotate(-22 1360 452)" fill="#5E6B45"/>
    <ellipse cx="1460" cy="452" rx="58" ry="15" transform="rotate(22 1460 452)" fill="#5E6B45"/>
