<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="ph-titulo ph-desc">
  <title id="ph-titulo">Portada: el Hotel Marina del Sol visto desde el paseo marítimo</title>
  <desc id="ph-desc">Ilustración de portada. Se ve la fachada blanca del hotel con toldos terracota, una palmera a cada lado y el mar al fondo. Sobre el cielo aparecen el nombre «Hotel Marina del Sol» y, debajo, en una sola línea, «50 habitaciones · Alicante · noches en propiedad».</desc>
  <defs>
    <linearGradient id="ph-cielo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FBF6EC"/>
      <stop offset="100%" stop-color="#C68A2E" stop-opacity="0.28"/>
    </linearGradient>
    <linearGradient id="ph-mar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0E5A63"/>
      <stop offset="100%" stop-color="#0F2C3F"/>
    </linearGradient>
    <filter id="ph-sombra" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#0E5A63" flood-opacity="0.14"/>
    </filter>
  </defs>

  <!-- cielo -->
  <rect x="0" y="0" width="1600" height="380" fill="#FBF6EC"/>
  <rect x="0" y="0" width="1600" height="380" fill="url(#ph-cielo)"/>
  <circle cx="1286" cy="118" r="84" fill="#C68A2E" fill-opacity="0.34"/>

  <!-- mar -->
  <rect x="0" y="380" width="1600" height="222" fill="url(#ph-mar)"/>
  <rect x="1136" y="380" width="300" height="24" fill="#C68A2E" fill-opacity="0.30"/>
  <path d="M0 442 H1600 M0 480 H1600 M0 522 H1600 M0 562 H1600" stroke="#FBF6EC" stroke-opacity="0.22" stroke-width="4" fill="none"/>

  <!-- paseo marítimo -->
  <rect x="0" y="592" width="1600" height="308" fill="#E7DCC6"/>
  <path d="M100 592 V900 M300 592 V900 M500 592 V900 M700 592 V900 M900 592 V900 M1100 592 V900 M1300 592 V900 M1500 592 V900" stroke="#0E5A63" stroke-opacity="0.10" stroke-width="4" fill="none"/>
  <rect x="0" y="598" width="1600" height="10" fill="#08424A"/>
  <rect x="0" y="642" width="1600" height="6" fill="#08424A" fill-opacity="0.72"/>
  <path d="M60 598 V706 M180 598 V706 M300 598 V706 M420 598 V706 M540 598 V706 M660 598 V706 M780 598 V706 M900 598 V706 M1020 598 V706 M1140 598 V706 M1260 598 V706 M1380 598 V706 M1500 598 V706" stroke="#08424A" stroke-width="7" stroke-opacity="0.85" fill="none"/>

  <!-- edificio del hotel -->
  <rect x="378" y="210" width="844" height="470" fill="#FFFFFF" stroke="#E7DCC6" stroke-width="3"/>
  <rect x="356" y="180" width="888" height="34" rx="8" fill="#C0542E"/>
  <rect x="378" y="672" width="844" height="14" rx="7" fill="#0E5A63" fill-opacity="0.14"/>

  <g fill="#0E5A63" fill-opacity="0.16" stroke="#0E5A63" stroke-width="2">
    <rect x="429" y="252" width="92" height="84" rx="6"/>
    <rect x="559" y="252" width="92" height="84" rx="6"/>
    <rect x="689" y="252" width="92" height="84" rx="6"/>
    <rect x="819" y="252" width="92" height="84" rx="6"/>
