<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="1200" height="700" role="img" aria-labelledby="df-titulo df-desc">
  <title id="df-titulo">Acceso con doble factor: tres cajas con un candado cada una</title>
  <desc id="df-desc">Tres cajas en fila, cada una con un candado: «1. Usuario y contraseña», «2. Código de 6 dígitos del móvil» y «3. Cartera conectada». Debajo, una nota con el texto «El código de 6 dígitos es solo para el personal del hotel».</desc>
  <defs>
    <filter id="df-sombra" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="5" stdDeviation="9" flood-color="#0F6C9C" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="1200" height="700" fill="#F4F9FC"/>
  <text x="600" y="70" text-anchor="middle" font-family="Fraunces, Georgia, 'Times New Roman', serif" font-size="34" font-weight="700" fill="#0A4F75">Cómo se entra: tres llaves</text>

  <!-- caja 1 -->
  <g filter="url(#df-sombra)">
    <rect x="30" y="110" width="369" height="330" rx="18" fill="#FFFFFF" stroke="#DBE7EF" stroke-width="2"/>
  </g>
  <path d="M196 195 v-12 a18 18 0 0 1 36 0 v12" stroke="#0F6C9C" stroke-width="5" fill="none"/>
  <rect x="184" y="195" width="60" height="48" rx="10" fill="#F4F9FC" stroke="#0F6C9C" stroke-width="5"/>
  <circle cx="214" cy="214" r="6" fill="#0F6C9C"/>
  <rect x="211" y="216" width="6" height="12" rx="3" fill="#0F6C9C"/>
  <text x="214" y="290" text-anchor="middle" font-family="'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="19" font-weight="700" fill="#101F2C">1. Usuario y contraseña</text>
  <text x="214" y="330" text-anchor="middle" font-family="'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="18" fill="#41566A">Algo que sabes</text>

  <!-- caja 2 -->
  <g filter="url(#df-sombra)">
    <rect x="415" y="110" width="369" height="330" rx="18" fill="#FFFFFF" stroke="#DBE7EF" stroke-width="2"/>
  </g>
  <path d="M581 195 v-12 a18 18 0 0 1 36 0 v12" stroke="#0F6C9C" stroke-width="5" fill="none"/>
  <rect x="569" y="195" width="60" height="48" rx="10" fill="#F4F9FC" stroke="#0F6C9C" stroke-width="5"/>
  <circle cx="599" cy="214" r="6" fill="#0F6C9C"/>
  <rect x="596" y="216" width="6" height="12" rx="3" fill="#0F6C9C"/>
  <text x="599" y="290" text-anchor="middle" font-family="'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="19" font-weight="700" fill="#101F2C" textLength="334" lengthAdjust="spacingAndGlyphs">2. Código de 6 dígitos del móvil</text>
  <text x="599" y="330" text-anchor="middle" font-family="'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="18" fill="#41566A">Algo que tienes</text>

  <!-- caja 3 -->
  <g filter="url(#df-sombra)">
    <rect x="800" y="110" width="369" height="330" rx="18" fill="#FFFFFF" stroke="#DBE7EF" stroke-width="2"/>
  </g>
  <path d="M966 195 v-12 a18 18 0 0 1 36 0 v12" stroke="#0F6C9C" stroke-width="5" fill="none"/>
  <rect x="954" y="195" width="60" height="48" rx="10" fill="#F4F9FC" stroke="#0F6C9C" stroke-width="5"/>
  <circle cx="984" cy="214" r="6" fill="#0F6C9C"/>
  <rect x="981" y="216" width="6" height="12" rx="3" fill="#0F6C9C"/>
  <text x="984" y="290" text-anchor="middle" font-family="'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="19" font-weight="700" fill="#101F2C">3. Cartera conectada</text>
  <text x="984" y="330" text-anchor="middle" font-family="'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="18" fill="#41566A">La que firma por ti</text>

  <!-- nota -->
  <rect x="30" y="480" width="1139" height="80" rx="16" fill="#B98324" fill-opacity="0.16" stroke="#B98324" stroke-width="2"/>
  <text x="600" y="530" text-anchor="middle" font-family="'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="24" font-weight="700" fill="#101F2C" textLength="700" lengthAdjust="spacingAndGlyphs">El código de 6 dígitos es solo para el personal del hotel</text>

  <text x="600" y="620" text-anchor="middle" font-family="'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="20" fill="#41566A">Con la contraseña sola no basta: hacen falta las tres.</text>
</svg>
