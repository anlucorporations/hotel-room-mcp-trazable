<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 780" width="800" height="780" role="img" aria-labelledby="asi-titulo asi-desc">
  <title id="asi-titulo">Flujo del asistente: le pides una noche, comprueba disponibilidad y precio, prepara la reserva, firmas en tu cartera y aparece en Mis noches</title>
  <desc id="asi-desc">Cinco pasos encadenados de arriba abajo. Le pides una noche al asistente, el asistente comprueba disponibilidad y precio, te prepara la reserva, la revisas y firmas en tu cartera, y la noche termina apareciendo en Mis noches. El asistente nunca firma por ti.</desc>
  <defs>
    <marker id="asi-azul" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#0F6C9C"/>
    </marker>
  </defs>

  <rect width="800" height="780" fill="#F4F9FC"/>
  <rect x="0" y="0" width="800" height="90" fill="#0A4F75"/>
  <text x="40" y="36" font-family="system-ui, Arial, sans-serif" font-size="14" font-weight="700" fill="#C3D4E0" letter-spacing="1.5">MANUAL DEL HUÉSPED · 07 · PEDIR AL ASISTENTE</text>
  <text x="40" y="70" font-family="system-ui, Arial, sans-serif" font-size="24" font-weight="700" fill="#FFFFFF">Pedirle una noche al asistente</text>

  <!-- paso 1 -->
  <rect x="90" y="120" width="620" height="88" rx="16" fill="#FFFFFF" stroke="#DBE7EF" stroke-width="2"/>
  <rect x="90" y="138" width="6" height="52" rx="3" fill="#0F6C9C"/>
  <circle cx="140" cy="164" r="22" fill="#0A4F75"/>
  <text x="140" y="171" text-anchor="middle" font-family="system-ui, Arial, sans-serif" font-size="20" font-weight="700" fill="#FFFFFF">1</text>
  <text x="182" y="158" font-family="system-ui, Arial, sans-serif" font-size="18" font-weight="700" fill="#101F2C">Pides una noche al asistente</text>
  <text x="182" y="184" font-family="system-ui, Arial, sans-serif" font-size="14" fill="#41566A">Le escribes qué noche quieres</text>

  <line x1="400" y1="210" x2="400" y2="242" stroke="#0F6C9C" stroke-width="3" marker-end="url(#asi-azul)"/>

  <!-- paso 2 -->
  <rect x="90" y="244" width="620" height="88" rx="16" fill="#FFFFFF" stroke="#DBE7EF" stroke-width="2"/>
  <rect x="90" y="262" width="6" height="52" rx="3" fill="#0F6C9C"/>
  <circle cx="140" cy="288" r="22" fill="#0A4F75"/>
  <text x="140" y="295" text-anchor="middle" font-family="system-ui, Arial, sans-serif" font-size="20" font-weight="700" fill="#FFFFFF">2</text>
  <text x="182" y="282" font-family="system-ui, Arial, sans-serif" font-size="18" font-weight="700" fill="#101F2C">El asistente comprueba disponibilidad y precio</text>
  <text x="182" y="308" font-family="system-ui, Arial, sans-serif" font-size="14" fill="#41566A">Lee el precio real anotado en el registro del hotel</text>

  <line x1="400" y1="334" x2="400" y2="366" stroke="#0F6C9C" stroke-width="3" marker-end="url(#asi-azul)"/>

  <!-- paso 3 -->
  <rect x="90" y="368" width="620" height="88" rx="16" fill="#FFFFFF" stroke="#DBE7EF" stroke-width="2"/>
  <rect x="90" y="386" width="6" height="52" rx="3" fill="#0F6C9C"/>
  <circle cx="140" cy="412" r="22" fill="#0A4F75"/>
  <text x="140" y="419" text-anchor="middle" font-family="system-ui, Arial, sans-serif" font-size="20" font-weight="700" fill="#FFFFFF">3</text>
  <text x="182" y="406" font-family="system-ui, Arial, sans-serif" font-size="18" font-weight="700" fill="#101F2C">Te prepara la reserva</text>
  <text x="182" y="432" font-family="system-ui, Arial, sans-serif" font-size="14" fill="#41566A">Te enseña lo que vas a firmar</text>

  <line x1="400" y1="458" x2="400" y2="490" stroke="#0F6C9C" stroke-width="3" marker-end="url(#asi-azul)"/>

  <!-- paso 4 -->
  <rect x="90" y="492" width="620" height="88" rx="16" fill="#FFFFFF" stroke="#DBE7EF" stroke-width="2"/>
  <rect x="90" y="510" width="6" height="52" rx="3" fill="#0F6C9C"/>
  <circle cx="140" cy="536" r="22" fill="#0A4F75"/>
  <text x="140" y="543" text-anchor="middle" font-family="system-ui, Arial, sans-serif" font-size="20" font-weight="700" fill="#FFFFFF">4</text>
  <text x="182" y="530" font-family="system-ui, Arial, sans-serif" font-size="18" font-weight="700" fill="#101F2C">Revisas y firmas en tu cartera</text>
  <text x="182" y="556" font-family="system-ui, Arial, sans-serif" font-size="14" fill="#41566A">La firma es siempre tuya</text>

  <line x1="400" y1="582" x2="400" y2="614" stroke="#0F6C9C" stroke-width="3" marker-end="url(#asi-azul)"/>

  <!-- paso 5 · resultado -->
  <rect x="90" y="616" width="620" height="88" rx="16" fill="#E2F2E9" stroke="#1F7A4D" stroke-width="2"/>
  <rect x="90" y="634" width="6" height="52" rx="3" fill="#1F7A4D"/>
  <circle cx="140" cy="660" r="22" fill="#1F7A4D"/>
  <text x="140" y="667" text-anchor="middle" font-family="system-ui, Arial, sans-serif" font-size="20" font-weight="700" fill="#FFFFFF">5</text>
  <text x="182" y="654" font-family="system-ui, Arial, sans-serif" font-size="18" font-weight="700" fill="#101F2C">La noche aparece en Mis noches</text>
  <text x="182" y="680" font-family="system-ui, Arial, sans-serif" font-size="14" fill="#41566A">Con la etiqueta Tuya</text>

  <text x="400" y="750" text-anchor="middle" font-family="system-ui, Arial, sans-serif" font-size="14" fill="#41566A">El asistente nunca firma por ti ni toca tus claves.</text>
</svg>
