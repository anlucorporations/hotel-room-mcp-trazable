<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="t d">
  <title id="t">CU-02 · Poner una noche a la venta: elegir habitación y fecha, poner precio, confirmar y firmar</title>
  <desc id="d">Cinco tarjetas numeradas unidas por flechas. La primera abre la pantalla de emisión; la segunda elige habitación y una fecha futura; la tercera escribe un precio en ETH mayor que cero; la cuarta confirma con el código de seis dígitos; la quinta firma en la cartera y espera el anclaje. Abajo se resume quién puede hacerlo, qué se consigue y qué pasa si algo falla.</desc>
  <rect width="1600" height="900" fill="#F4F9FC"/>
  <rect x="0" y="0" width="1600" height="156" fill="#0A4F75"/>
  <text x="60" y="66" font-family="'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="24" font-weight="700" fill="#C3D4E0" letter-spacing="2">CU-02 · BLOQUE 2</text>
  <text x="60" y="122" font-family="Fraunces, Georgia, 'Times New Roman', serif" font-size="42" font-weight="700" fill="#FFFFFF">Poner una noche a la venta</text>

  <!-- paso 1 -->
  <rect x="60" y="210" width="270" height="420" rx="18" fill="#FFFFFF" stroke="#DBE7EF" stroke-width="2"/>
  <circle cx="195" cy="300" r="36" fill="#0A4F75"/>
  <text x="195" y="312" text-anchor="middle" font-family="'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="30" font-weight="700" fill="#FFFFFF">1</text>
  <text x="195" y="408" text-anchor="middle" font-family="'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="22" font-weight="700" fill="#101F2C">Abrir emisión</text>
  <text x="195" y="474" text-anchor="middle" font-family="'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="20" fill="#41566A">Entra en /admin/mint</text>
  <text x="195" y="506" text-anchor="middle" font-family="'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="20" fill="#41566A">con tu cuenta.</text>
  <path d="M96 530 H294" stroke="#DBE7EF" stroke-width="2" fill="none"/>
  <rect x="90" y="546" width="210" height="48" rx="14" fill="#E6F0F6" stroke="#DBE7EF" stroke-width="2"/>
  <text x="195" y="577" text-anchor="middle" font-family="'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="20" font-weight="700" fill="#0F6C9C">Alta de noches</text>

  <!-- paso 2 -->
  <rect x="360" y="210" width="270" height="420" rx="18" fill="#FFFFFF" stroke="#DBE7EF" stroke-width="2"/>
  <circle cx="495" cy="300" r="36" fill="#0A4F75"/>
  <text x="495" y="312" text-anchor="middle" font-family="'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="30" font-weight="700" fill="#FFFFFF">2</text>
  <text x="495" y="408" text-anchor="middle" font-family="'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="22" font-weight="700" fill="#101F2C">Habitación y fecha</text>
  <text x="495" y="474" text-anchor="middle" font-family="'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="20" fill="#41566A">Escribe el número y</text>
  <text x="495" y="506" text-anchor="middle" font-family="'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="20" fill="#41566A">elige un día futuro.</text>
  <path d="M396 530 H594" stroke="#DBE7EF" stroke-width="2" fill="none"/>
  <rect x="390" y="546" width="210" height="48" rx="14" fill="#E6F0F6" stroke="#DBE7EF" stroke-width="2"/>
  <text x="495" y="577" text-anchor="middle" font-family="'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="20" font-weight="700" fill="#0F6C9C">Día real y futuro</text>

  <!-- paso 3 -->
  <rect x="660" y="210" width="270" height="420" rx="18" fill="#FFFFFF" stroke="#DBE7EF" stroke-width="2"/>
  <circle cx="795" cy="300" r="36" fill="#0A4F75"/>
  <text x="795" y="312" text-anchor="middle" font-family="'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="30" font-weight="700" fill="#FFFFFF">3</text>
  <text x="795" y="408" text-anchor="middle" font-family="'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="22" font-weight="700" fill="#101F2C">Poner el precio</text>
  <text x="795" y="474" text-anchor="middle" font-family="'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="20" fill="#41566A">En ETH y siempre</text>
  <text x="795" y="506" text-anchor="middle" font-family="'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="20" fill="#41566A">mayor que cero.</text>
  <path d="M696 530 H894" stroke="#DBE7EF" stroke-width="2" fill="none"/>
  <rect x="690" y="546" width="210" height="48" rx="14" fill="#E6F0F6" stroke="#DBE7EF" stroke-width="2"/>
  <text x="795" y="577" text-anchor="middle" font-family="'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="20" font-weight="700" fill="#0F6C9C">Precio en ETH</text>

  <!-- paso 4 -->
  <rect x="960" y="210" width="270" height="420" rx="18" fill="#FFFFFF" stroke="#DBE7EF" stroke-width="2"/>
  <circle cx="1095" cy="300" r="36" fill="#0A4F75"/>
  <text x="1095" y="312" text-anchor="middle" font-family="'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="30" font-weight="700" fill="#FFFFFF">4</text>
  <text x="1095" y="408" text-anchor="middle" font-family="'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="22" font-weight="700" fill="#101F2C">Confirmar el alta</text>
  <text x="1095" y="474" text-anchor="middle" font-family="'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="20" fill="#41566A">Escribe el código de</text>
  <text x="1095" y="506" text-anchor="middle" font-family="'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="20" fill="#41566A">seis dígitos.</text>
  <path d="M996 530 H1194" stroke="#DBE7EF" stroke-width="2" fill="none"/>
  <rect x="990" y="546" width="210" height="48" rx="14" fill="#FBF0D6"/>
  <text x="1095" y="577" text-anchor="middle" font-family="'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="20" font-weight="700" fill="#8A5F0C">Doble control</text>

  <!-- paso 5 -->
  <rect x="1260" y="210" width="270" height="420" rx="18" fill="#FFFFFF" stroke="#DBE7EF" stroke-width="2"/>
  <circle cx="1395" cy="300" r="36" fill="#0A4F75"/>
  <text x="1395" y="312" text-anchor="middle" font-family="'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="30" font-weight="700" fill="#FFFFFF">5</text>
  <text x="1395" y="408" text-anchor="middle" font-family="'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="22" font-weight="700" fill="#101F2C">Firmar y esperar</text>
  <text x="1395" y="474" text-anchor="middle" font-family="'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="20" fill="#41566A">Firma en la cartera y</text>
  <text x="1395" y="506" text-anchor="middle" font-family="'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="20" fill="#41566A">espera el anclaje.</text>
  <path d="M1296 530 H1494" stroke="#DBE7EF" stroke-width="2" fill="none"/>
  <rect x="1290" y="546" width="210" height="48" rx="14" fill="#E2F2E9"/>
  <text x="1395" y="577" text-anchor="middle" font-family="'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="20" font-weight="700" fill="#1F7A4D">Queda anclada</text>

  <text x="345" y="428" text-anchor="middle" font-family="'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="26" font-weight="700" fill="#0F6C9C">&#8594;</text>
  <text x="645" y="428" text-anchor="middle" font-family="'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="26" font-weight="700" fill="#0F6C9C">&#8594;</text>
  <text x="945" y="428" text-anchor="middle" font-family="'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="26" font-weight="700" fill="#0F6C9C">&#8594;</text>
  <text x="1245" y="428" text-anchor="middle" font-family="'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="26" font-weight="700" fill="#0F6C9C">&#8594;</text>

  <rect x="0" y="740" width="1600" height="160" fill="#E6F0F6"/>
  <text x="60" y="790" font-family="'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="20" font-weight="700" fill="#41566A" letter-spacing="1.5">QUIÉN</text>
  <text x="60" y="838" font-family="'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="24" font-weight="700" fill="#101F2C">Operador con rol MINTER y cartera</text>
  <text x="590" y="790" font-family="'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="20" font-weight="700" fill="#41566A" letter-spacing="1.5">QUÉ CONSIGUES</text>
  <text x="590" y="838" font-family="'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="24" font-weight="700" fill="#101F2C">Noche nueva lista para vender</text>
  <text x="1120" y="790" font-family="'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="20" font-weight="700" fill="#41566A" letter-spacing="1.5">SI FALLA</text>
  <text x="1120" y="838" font-family="'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="24" font-weight="700" fill="#101F2C">Sin rol, en pausa o repetida</text>
  <text x="1120" y="872" font-family="'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="24" font-weight="700" fill="#101F2C">no hay alta posible</text>
</svg>
