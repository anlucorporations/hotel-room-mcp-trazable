<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 500" width="1600" height="500" role="img" aria-labelledby="ec-titulo ec-desc">
  <title id="ec-titulo">Línea de tiempo: comprar, resguardo, check-in, reventa y cobro</title>
  <desc id="ec-desc">Línea de tiempo con cinco paradas unidas por una flecha: Comprar (móvil con cartera), Resguardo (código QR en un móvil), Check-in (mostrador con lector), Reventa (dos manos intercambiando una tarjeta) y Cobro (moneda entrando en una cartera). Debajo de cada parada hay una frase de seis palabras como máximo.</desc>
  <defs>
    <filter id="ec-sombra" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="4" stdDeviation="7" flood-color="#0E5A63" flood-opacity="0.14"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="1600" height="500" fill="#FBF6EC"/>
  <text x="800" y="70" text-anchor="middle" font-family="Fraunces, Georgia, 'Times New Roman', serif" font-size="32" font-weight="700" fill="#08424A" textLength="640" lengthAdjust="spacingAndGlyphs">De la compra al cobro, en cinco paradas</text>

  <!-- línea que une las paradas -->
  <path d="M160 200 H1440" stroke="#E7DCC6" stroke-width="8" fill="none"/>
  <g fill="#0E5A63">
    <polygon points="334,200 314,192 314,208"/>
    <polygon points="654,200 634,192 634,208"/>
    <polygon points="974,200 954,192 954,208"/>
    <polygon points="1294,200 1274,192 1274,208"/>
  </g>

  <!-- parada 1 · Comprar -->
  <g filter="url(#ec-sombra)">
    <circle cx="160" cy="200" r="54" fill="#FFFFFF" stroke="#0E5A63" stroke-width="4"/>
  </g>
  <rect x="138" y="162" width="44" height="76" rx="10" fill="#FBF6EC" stroke="#0E5A63" stroke-width="3"/>
  <rect x="146" y="192" width="28" height="18" rx="4" fill="#C68A2E"/>
  <circle cx="160" cy="182" r="7" fill="#C68A2E"/>
  <text x="160" y="302" text-anchor="middle" font-family="Fraunces, Georgia, 'Times New Roman', serif" font-size="28" font-weight="700" fill="#08424A">Comprar</text>
  <text x="160" y="340" text-anchor="middle" font-family="'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="19" fill="#4C575C">Eliges la noche y firmas</text>

  <!-- parada 2 · Resguardo -->
  <g filter="url(#ec-sombra)">
    <circle cx="480" cy="200" r="54" fill="#FFFFFF" stroke="#0E5A63" stroke-width="4"/>
  </g>
  <rect x="458" y="162" width="44" height="76" rx="10" fill="#FBF6EC" stroke="#0E5A63" stroke-width="3"/>
  <g fill="#1B2327">
    <rect x="466" y="174" width="12" height="12" rx="2"/>
    <rect x="482" y="174" width="12" height="12" rx="2"/>
    <rect x="466" y="190" width="12" height="12" rx="2"/>
    <rect x="482" y="190" width="6" height="6"/>
    <rect x="490" y="198" width="6" height="6"/>
    <rect x="466" y="210" width="6" height="6"/>
    <rect x="478" y="210" width="6" height="6"/>
    <rect x="490" y="210" width="6" height="6"/>
  </g>
  <text x="480" y="302" text-anchor="middle" font-family="Fraunces, Georgia, 'Times New Roman', serif" font-size="28" font-weight="700" fill="#08424A">Resguardo</text>
  <text x="480" y="340" text-anchor="middle" font-family="'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="19" fill="#4C575C">Recibes el QR al momento</text>

  <!-- parada 3 · Check-in -->
  <g filter="url(#ec-sombra)">
    <circle cx="800" cy="200" r="54" fill="#FFFFFF" stroke="#0E5A63" stroke-width="4"/>
  </g>
  <polygon points="786,192 814,192 822,220 778,220" fill="#C68A2E" fill-opacity="0.35"/>
  <rect x="786" y="168" width="28" height="22" rx="5" fill="#0E5A63"/>
  <rect x="770" y="222" width="60" height="10" rx="4" fill="#08424A"/>
  <text x="800" y="302" text-anchor="middle" font-family="Fraunces, Georgia, 'Times New Roman', serif" font-size="28" font-weight="700" fill="#08424A">Check-in</text>
  <text x="800" y="340" text-anchor="middle" font-family="'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="19" fill="#4C575C">Recepción lo escanea</text>

  <!-- parada 4 · Reventa -->
  <g filter="url(#ec-sombra)">
    <circle cx="1120" cy="200" r="54" fill="#FFFFFF" stroke="#0E5A63" stroke-width="4"/>
  </g>
  <path d="M1092 176 q 28 -16 56 0" stroke="#0E5A63" stroke-width="3" fill="none"/>
  <polygon points="1092,176 1100,168 1102,180" fill="#0E5A63"/>
  <polygon points="1148,176 1140,168 1138,180" fill="#0E5A63"/>
  <rect x="1104" y="190" width="32" height="22" rx="4" fill="#FFFFFF" stroke="#0E5A63" stroke-width="3"/>
  <rect x="1086" y="200" width="18" height="14" rx="7" fill="#C68A2E"/>
  <ellipse cx="1096" cy="196" rx="7" ry="4" fill="#C68A2E"/>
  <rect x="1136" y="200" width="18" height="14" rx="7" fill="#C68A2E"/>
  <ellipse cx="1144" cy="196" rx="7" ry="4" fill="#C68A2E"/>
  <text x="1120" y="302" text-anchor="middle" font-family="Fraunces, Georgia, 'Times New Roman', serif" font-size="28" font-weight="700" fill="#08424A">Reventa</text>
  <text x="1120" y="340" text-anchor="middle" font-family="'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="19" fill="#4C575C">Otro cliente la compra</text>

  <!-- parada 5 · Cobro -->
  <g filter="url(#ec-sombra)">
    <circle cx="1440" cy="200" r="54" fill="#FFFFFF" stroke="#0E5A63" stroke-width="4"/>
  </g>
  <circle cx="1440" cy="172" r="12" fill="#C68A2E" stroke="#08424A" stroke-width="2"/>
  <path d="M1436 172 h8" stroke="#08424A" stroke-width="2" fill="none"/>
  <rect x="1414" y="196" width="52" height="34" rx="8" fill="#0E5A63"/>
  <rect x="1414" y="188" width="52" height="12" rx="6" fill="#08424A"/>
  <text x="1440" y="302" text-anchor="middle" font-family="Fraunces, Georgia, 'Times New Roman', serif" font-size="28" font-weight="700" fill="#08424A">Cobro</text>
  <text x="1440" y="340" text-anchor="middle" font-family="'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="19" fill="#4C575C">Cobras tu saldo</text>

  <text x="800" y="424" text-anchor="middle" font-family="'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="20" fill="#4C575C">Todo queda anotado en la cadena.</text>
</svg>
