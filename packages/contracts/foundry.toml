[profile.default]
src = "src"
out = "out"
test = "test"
script = "script"
libs = ["lib"]
solc = "0.8.24"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
bytecode_hash = "none"
# Permite a los scripts escribir el registro de despliegue.
fs_permissions = [{ access = "read-write", path = "./deployments" }]
ffi = false

[profile.ci]
verbosity = 3

[fmt]
line_length = 100
tab_width = 4
bracket_spacing = false
int_types = "long"
