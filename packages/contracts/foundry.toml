[profile.default]
src = "src"
out = "out"
test = "test"
script = "script"
libs = ["lib"]
solc = "0.8.24"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
bytecode_hash = "none"
# Permite a los scripts escribir el registro de despliegue.
fs_permissions = [{ access = "read-write", path = "./deployments" }]
ffi = false
# Ejecución en serie de las pruebas: las suites de despliegue escriben un fichero compartido
# (`deployments/latest.json`) y configuran el entorno con `vm.setEnv`, que persiste entre
# funciones de prueba. En paralelo se producen carreras y contaminación entre casos.
threads = 1

[profile.ci]
verbosity = 3

# Invariantes financieras (MAJOR#2): secuencias aleatorias contra el handler.
[invariant]
runs = 256
depth = 32
fail_on_revert = false

[fuzz]
runs = 256

[fmt]
line_length = 100
tab_width = 4
bracket_spacing = false
int_types = "long"
