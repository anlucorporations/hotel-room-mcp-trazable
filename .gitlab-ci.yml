# =============================================================================
# Pipeline de GitLab CI/CD — Hotel Marina del Sol (hotel-room-mcp-trazable)
# Monorepo: Node.js 24 + pnpm 10 + Foundry + Slither + Playwright
# =============================================================================

default:
  image: node:24-bookworm

variables:
  GIT_SUBMODULE_STRATEGY: recursive
  PNPM_VERSION: "10.32.1"
  FOUNDRY_VERSION: "v1.7.1"

stages:
  - lint
  - test
  - coverage
  - slither
  - e2e

cache:
  key:
    files:
      - pnpm-lock.yaml
  paths:
    - .pnpm-store

.setup_pnpm_and_foundry: &setup_pnpm_and_foundry
  before_script:
    - apt-get update && apt-get install -y --no-install-recommends curl git unzip
    - corepack enable && corepack prepare "pnpm@${PNPM_VERSION}" --activate
    - curl -L https://foundry.paradigm.xyz | bash
    - export PATH="$HOME/.foundry/bin:$PATH"
    - foundryup --install "${FOUNDRY_VERSION}"
    - pnpm config set store-dir "$CI_PROJECT_DIR/.pnpm-store"
    - pnpm install --frozen-lockfile

# ── 1. Etapa de Linting y Tipado Estático ──────────────────────────────────────
lint:
  stage: lint
  <<: *setup_pnpm_and_foundry
  script:
    - export PATH="$HOME/.foundry/bin:$PATH"
    - pnpm typecheck
    - pnpm lint

# ── 2. Etapa de Pruebas Unitarias y de Integración ───────────────────────────
test:
  stage: test
  <<: *setup_pnpm_and_foundry
  script:
    - export PATH="$HOME/.foundry/bin:$PATH"
    - pnpm test

# ── 3. Etapa de Cobertura de Código (Foundry + Vitest) ────────────────────────
coverage:
  stage: coverage
  <<: *setup_pnpm_and_foundry
  script:
    - export PATH="$HOME/.foundry/bin:$PATH"
    - cd packages/contracts
    - forge coverage --report lcov || true
  artifacts:
    when: always
    paths:
      - packages/contracts/lcov.info
    expire_in: 14 days

# ── 4. Análisis Estático de Smart Contracts con Slither ────────────────────────
slither:
  stage: slither
  image: ghcr.io/trailofbits/eth-security-toolbox:latest
  before_script: []
  script:
    - cd packages/contracts
    - slither . --config-file slither.config.json --fail-high
  allow_failure: false

# ── 5. Pruebas E2E con Playwright ─────────────────────────────────────────────
e2e:
  stage: e2e
  before_script:
    - corepack enable && corepack prepare "pnpm@${PNPM_VERSION}" --activate
    - pnpm config set store-dir "$CI_PROJECT_DIR/.pnpm-store"
    - pnpm install --frozen-lockfile
  script:
    - pnpm --filter @hotel/shared build
    - pnpm --filter @hotel/web build || true
    - pnpm --filter @hotel/web exec playwright install --with-deps chromium || true
    - pnpm --filter @hotel/web test:e2e || true
  allow_failure: true
