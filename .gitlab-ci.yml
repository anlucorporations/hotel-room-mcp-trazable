# Pipeline de GitLab (espejo de .github/workflows/ci.yml). Requiere un runner con
# executor Docker. Para GitHub Actions sigue valiendo el workflow de .github/.
default:
  image: node:24-bookworm

variables:
  GIT_SUBMODULE_STRATEGY: recursive # deps Solidity (OZ v5, forge-std)
  PNPM_VERSION: "10.32.1"

stages:
  - verify
  - e2e

cache:
  key:
    files:
      - pnpm-lock.yaml
  paths:
    - .pnpm-store

# ── Pipeline principal: build + typecheck + lint + test + deploy de humo a Anvil ──
verify:
  stage: verify
  before_script:
    - apt-get update && apt-get install -y --no-install-recommends curl git unzip
    - corepack enable && corepack prepare "pnpm@${PNPM_VERSION}" --activate
    - curl -L https://foundry.paradigm.xyz | bash
    - export PATH="$HOME/.foundry/bin:$PATH" && foundryup
    - pnpm config set store-dir "$CI_PROJECT_DIR/.pnpm-store"
    - pnpm install --frozen-lockfile
  script:
    - export PATH="$HOME/.foundry/bin:$PATH"
    - pnpm build # turbo: shared → apps + forge build
    - pnpm typecheck
    - pnpm lint
    - pnpm test # vitest (shared/worker/mcp) + forge test
    - pnpm --filter @hotel/contracts smoke # deploy de humo a Anvil 81234 + verificación de roles

# ── E2E de la web con Playwright ──
e2e:
  stage: e2e
  before_script:
    - corepack enable && corepack prepare "pnpm@${PNPM_VERSION}" --activate
    - pnpm config set store-dir "$CI_PROJECT_DIR/.pnpm-store"
    - pnpm install --frozen-lockfile
  script:
    - pnpm --filter @hotel/shared build
    - pnpm --filter @hotel/web build
    - pnpm --filter @hotel/web exec playwright install --with-deps chromium
    - pnpm --filter @hotel/web test:e2e

# ── Análisis estático del contrato (informativo; no bloquea) ──
slither:
  stage: verify
  image: ghcr.io/trailofbits/eth-security-toolbox:latest
  allow_failure: true
  before_script: []
  script:
    - cd packages/contracts
    - slither . --config-file slither.config.json || true
